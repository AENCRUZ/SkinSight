<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password — SKINSIGHT</title>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#FBF9F5">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/auth-pages.css">
<script src="js/ui.js"></script>
<script>
  (function () {
    try {
      var k = localStorage.getItem("skinsight_user") || sessionStorage.getItem("skinsight_user");
      if (!k) {
        for (var i = 0; i < localStorage.length; i++) {
          var key = localStorage.key(i);
          if (key && key.indexOf("sb-") === 0 && key.indexOf("-auth-token") !== -1) {
            k = localStorage.getItem(key);
            break;
          }
        }
      }
      if (k) {
        document.documentElement.classList.add("auth-user-signed-in");
      }
    } catch (e) {}
  })();
</script>
</head>
<body>

<site-header data-nav="none"></site-header>
<noscript><p class="noscript-note">SKINSIGHT needs JavaScript for navigation and the AI assistant. Please enable it to continue.</p></noscript>
<main id="main">

<section class="auth-page">
  <div class="auth-shell is-single">
    <div class="auth-card">

      <a href="login.html" class="auth-back"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-chevron-left"/></svg> Back to Log In</a>

      <div class="auth-head">
        <div class="brand"><img class="brand-mark" src="img/logo-mark.svg" alt="" width="26" height="26"><span class="brand-word">SKIN<span>SIGHT</span></span></div>
        <h1>Reset your password</h1>
        <p>Enter the email on your account and we'll send a link to reset your password.</p>
      </div>

      <form data-auth-form novalidate>
        <div class="field">
          <label for="reset-email">Email <span class="req" aria-hidden="true">*</span></label>
          <input type="email" id="reset-email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>

        <div class="notice strong" data-auth-note role="alert"></div>
      </form>

      <div class="auth-success" data-auth-success role="status">
        <div class="success-icon"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-check"/></svg></div>
        <h1>Check your email</h1>
        <p>If an account exists for that email, a reset link is on its way.</p>
        <a href="login.html" class="btn btn-secondary btn-block">Back to Log In</a>
      </div>

      <p class="auth-switch">Remembered your password? <a href="login.html">Log in</a></p>
    </div>
  </div>
</section>

</main>

<site-footer></site-footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.min.js" integrity="sha384-gnyZit14c5lnGcarmA166QQjjJXpucw25ogZXuwH3HxxY904zHkBqmxVpelsPorb" crossorigin="anonymous"></script>
<script src="js/supabase-config.js"></script>
<script src="js/site.js" defer></script>
<script src="js/auth.js" defer></script>
</body>
</html>
