<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add Medication — SKINSIGHT</title>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#FBF9F5">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/features.css">
<link rel="stylesheet" href="css/medication-tracker.css">
<script src="js/ui.js"></script>
<script>
  (function () {
    try {
      var k = localStorage.getItem("skinsight_user");
      if (!k) {
        for (var i = 0; i < localStorage.length; i++) {
          var key = localStorage.key(i);
          if (key && key.indexOf("sb-") === 0 && key.indexOf("-auth-token") !== -1) {
            k = localStorage.getItem(key);
            break;
          }
        }
      }
      if (k) {
        document.documentElement.classList.add("auth-user-signed-in");
      }
    } catch (e) {}
  })();
</script>
</head>
<body>

<site-header data-nav="meds"></site-header>
<noscript><p class="noscript-note">SKINSIGHT needs JavaScript for navigation and the AI assistant. Please enable it to continue.</p></noscript>
<main id="main">

<div class="page-header">
  <div class="wrap">
    <span class="eyebrow">Medication Tracker</span>
    <h1>Add Medication</h1>
    <p>Enter details for a medication prescribed or recommended by a healthcare professional.</p>
  </div>
</div>

<section class="feature-section">
  <div class="wrap wrap-form" id="medApp">
    <noscript><div class="med-alert is-warning"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-alert-circle"/></svg><p><strong>JavaScript is required.</strong> The medication tracker runs in your browser and stores its data on this device, so it can't work without JavaScript.</p></div></noscript>
    <div id="medNotice"></div>
    <div class="med-alerts" id="medAlerts"></div>

    <div class="card card-static form-card">
      <h2>Medication details</h2>
      <div id="medFormMount"></div>
    </div>
    <p class="visually-hidden" id="medLive" role="status" aria-live="polite"></p>
  </div>
</section>

</main>

<site-footer></site-footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.min.js" integrity="sha384-gnyZit14c5lnGcarmA166QQjjJXpucw25ogZXuwH3HxxY904zHkBqmxVpelsPorb" crossorigin="anonymous"></script>
<script src="js/supabase-config.js"></script>
<script src="js/site.js" defer></script>
<script src="js/auth.js" defer></script>
<script src="js/medication-store.js" defer></script>
<script src="js/meds-ui.js" defer></script>
</body>
</html>
