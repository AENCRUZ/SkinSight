<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=frontend/">
  <link rel="canonical" href="frontend/">
  <title>SKINSIGHT</title>
  <script>
    // Immediate redirect preserving query string and URL hash
    window.location.replace("frontend/" + window.location.search + window.location.hash);
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f7fafc;
      color: #2d3748;
    }
    .redirect-card {
      text-align: center;
      padding: 2rem;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .redirect-card a {
      color: #0d9488;
      font-weight: 600;
      text-decoration: none;
    }
    .redirect-card a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <h2>Redirecting to SKINSIGHT...</h2>
    <p>If you are not redirected automatically, please <a href="frontend/">click here</a>.</p>
  </div>
</body>
</html>
