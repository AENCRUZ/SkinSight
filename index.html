<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=frontend/">
  <link rel="canonical" href="frontend/">
  <title>SKINSIGHT</title>
  <script>
    // Immediate redirect preserving query string and URL hash
    window.location.replace("frontend/" + window.location.search + window.location.hash);
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Open Sans', 'Segoe UI', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #CAF0F8;
      color: #03045E;
    }
    .redirect-card {
      text-align: center;
      padding: 2rem;
      background: #ffffff;
      font-family: Montserrat, 'Open Sans', sans-serif;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(3, 4, 94, 0.12);
    }
    .redirect-card a {
      color: #0077B6;
      font-weight: 600;
      text-decoration: none;
    }
    .redirect-card a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <h2>Redirecting to SKINSIGHT...</h2>
    <p>If you are not redirected automatically, please <a href="frontend/">click here</a>.</p>
  </div>
</body>
</html>
